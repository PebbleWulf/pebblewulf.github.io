<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pebblewulff</title>
  <meta name="description" content="Pebblewulff — independent mobile games.">
  <style>
    :root {
      --bg: #f6f4ef;
      --fg: #1d1c1a;
      --muted: #6b675f;
      --accent: #3f6f5a;
      --card: #ffffff;
      --line: #e3dfd6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161614;
        --fg: #ece9e2;
        --muted: #a29d93;
        --accent: #7fb89c;
        --card: #1f1f1c;
        --line: #2e2d29;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    header { padding: 56px 0 24px; }
    .logo { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
    .tag { color: var(--muted); margin: 4px 0 0; }
    h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 48px 0 16px; }
    .game {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
    }
    .game h3 { margin: 0 0 6px; font-size: 1.4rem; }
    .game p { margin: 0 0 16px; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
    }
    a { color: var(--accent); }
    footer {
      margin: 64px 0 40px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer a { margin-right: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="logo">Pebblewulff</p>
      <p class="tag">Independent mobile games, made in Australia.</p>
    </header>

    <h2>Games</h2>
    <div class="game">
      <h3>[GAME NAME]</h3>
      <p>[One or two sentences about the game.]</p>
      <!-- Replace the href with your Play Store link once the game is live:
           https://play.google.com/store/apps/details?id=[your.package.name] -->
      <a class="btn" href="#">Coming soon to Google Play</a>
    </div>

    <h2>Contact</h2>
    <p>Questions, bug reports or feedback: <a href="mailto:[CONTACT EMAIL]">[CONTACT EMAIL]</a></p>

    <footer>
      <a href="privacy.html">Privacy policy</a>
      <span>&copy; 2026 Pebblewulff</span>
    </footer>
  </div>
</body>
</html>
